# The instances of the validation and their published optimal values.
#
# An archive is downloaded at a fixed commit and checked by the git tree hash of its content
# (`Tar.tree_hash`), which does not depend on how GitHub compresses it. A family gives the files
# of its instances, `{n}` replaced by each instance's `n`; an instance gives its published optimal
# value, `value`, as printed by its reference, or, for an integer program whose optimum is not
# known, the published bounds `lower` and `upper`. The tolerance is half a unit of the last digit
# printed (of the sixth significant digit for a reference that rounds to six), plus 1e-9 of the
# value for the accuracy of the solve. The reference is the
# collection's own value when there is one; when it differs from ours and another published value,
# computed on the same files, agrees with ours, that one is the reference, and `note` gives the
# collection's. `probability_sums` is the option of `read_smps`: probabilities written with a few
# digits are kept as written where the published values were computed so. `size` sorts the
# instances by the time HiGHS takes on their deterministic equivalent: `small` (seconds, run by
# the continuous integration), `medium` (minutes), `large` (more, and a few gigabytes), `huge`
# (over ten million nonzeros: more memory than most computers have). `known`
# documents a difference that remains, and what is known of its cause: the instance is then
# expected to differ.

[archive.splib]
url = "https://codeload.github.com/vitaut-archive/splib/tar.gz/2578558868ee62451117dbd0ee03250cc3203c3b"
root = "splib-2578558868ee62451117dbd0ee03250cc3203c3b"
tree_hash = "8b7b4404121518f4e31b61d3b82378320eea1844"
description = "SPLIB, Victor Zverovich's collection of stochastic programming test problems (https://github.com/vitaut-archive/splib)"

[archive.coin]
url = "https://codeload.github.com/coin-or-tools/Data-Stochastic/tar.gz/097e43a14777e8f13706a44088e7b495d6258e34"
root = "Data-Stochastic-097e43a14777e8f13706a44088e7b495d6258e34"
tree_hash = "bc32d62e8c8bd6eb6a88c395168b97f3c868be93"
description = "COIN-OR's stochastic test data, release 1.1.7 (https://github.com/coin-or-tools/Data-Stochastic)"

[reference.posts]
cite = "Holmes, POSTS, a portable stochastic programming test set (1995): the file posts/Post_Results of SPLIB"

[reference.felt]
cite = "Ariyawansa and Felt, On a new collection of stochastic linear programming test problems (INFORMS Journal on Computing, 2004): the solutions of the test set in SPLIB's slptestset (solution.txt, solutions_cpa0.1, solutions_3stage)"

[reference.zverovich]
cite = "Zverovich, Modelling and solution methods for stochastic optimisation (PhD thesis, Brunel University, 2011), Table 4.3, rounded to six significant digits"
significant = 6

[reference.siplib]
cite = "Ahmed et al., SIPLIB, a stochastic integer programming test problem library (https://www2.isye.gatech.edu/~sahmed/siplib/, 2015): the optimal values (SSLP, SIZES) or the best bounds (DCAP, SEMI) of its pages"

[reference.kim]
cite = "Kim and Dandurand, Scalable branching on dual decomposition of stochastic mixed-integer programming problems (Mathematical Programming Computation, 2022), Table 2: the bounds of the method CS+DW, optimal within 0.01%"

[reference.cirrelt]
cite = "Zehtabian and Bastin, Penalty parameter update strategies in progressive hedging algorithm (CIRRELT-2016-12), Table 2"

