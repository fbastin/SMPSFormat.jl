# SIPLIB gives for DCAP the bounds of the DBB method of Ahmed, Tawarmalani and Sahinidis (2004).
# In 200 and 500 scenarios, whose probabilities are exact, its lower bound is above the optimal
# value that Kim and Dandurand prove on four of the five instances they solve, and the solve here
# finds solutions of their values below SIPLIB's lower bounds (dcap233_200, dcap243_200,
# dcap243_500): their values are the reference; where they prove no optimum, the lower bound is
# their best one, the upper bound SIPLIB's. In 300 scenarios, whose probabilities are written
# 0.003333, SIPLIB's bounds agree with the optimum of dcap243_300, Kim and Dandurand's value does
