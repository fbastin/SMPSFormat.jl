# SIPLIB gives for DCAP the bounds of the DBB method of Ahmed, Tawarmalani and Sahinidis (2004).
# In 200 and 500 scenarios, whose probabilities are exact, its lower bound is above the optimal
# value that Kim and Dandurand prove on four of the five instances they solve, and the solve here
# finds solutions of their values below SIPLIB's lower bounds (dcap233_200, dcap243_200,
# dcap243_500): their values are the reference; where they prove no optimum, the lower bound is
# their best one, the upper bound SIPLIB's. In 300 scenarios, whose probabilities are written
# 0.003333, SIPLIB's bounds agree with the optimum of dcap243_300, Kim and Dandurand's value does
# not, with the probabilities normalized or as written: SIPLIB's bounds are the reference.
[[family]]
name = "dcap{n}"
archive = "splib"
files = ["siplib/dcap{d}/dcap{d}-{s}.cor", "siplib/dcap{d}/dcap{d}-{s}.tim", "siplib/dcap{d}/dcap{d}-{s}.sto"]
reference = "kim"
instances = [
    { n = "233_200", d = "233", s = "200", lower = "1834.55", upper = "1834.57", size = "medium", note = "SIPLIB: [1834.868, 1834.893]." },
    { n = "233_300", d = "233", s = "300", lower = "1644.342", upper = "1644.504", size = "large", reference = "siplib", note = "Kim and Dandurand: [1644.19, 1644.20]." },
    { n = "233_500", d = "233", s = "500", lower = "1737.52", upper = "1737.54", size = "large", note = "SIPLIB: [1737.719, 1737.728]." },
    { n = "243_200", d = "243", s = "200", lower = "2322.49", upper = "2322.49", size = "medium", note = "SIPLIB: [2322.721, 2322.721]." },
    { n = "243_300", d = "243", s = "300", lower = "2559.297", upper = "2559.545", size = "medium", reference = "siplib", note = "Kim and Dandurand: [2559.19, 2559.19], below the optimum found here with the probabilities normalized (2559.4478) or as written (2559.2128)." },
