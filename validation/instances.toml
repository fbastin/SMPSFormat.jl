[reference.bayraksan]
cite = "Bayraksan and Morton, A sequential sampling procedure for stochastic programming (Operations Research, 2011), Table 2: the optimal value, the problem solved exactly"

[reference.consigli]
cite = "Consigli and Dempster, Dynamic stochastic programming for asset-liability management (Annals of Operations Research, 1998), Table 2 (independent scenarios, wati) and Table 3 (conditional scenarios, watc): the terminal wealth maximized, whose opposite the files minimize, with the digits on which their solvers agree, at least two decimals"
decimals = 2

[reference.dempster]
cite = "Dempster and Thompson, Parallelization and aggregation of nested Benders decomposition (Annals of Operations Research, 1998), Table 3"

[reference.lsw]
cite = "Linderoth, Shapiro and Wright, The empirical behavior of sampling methods for stochastic programming (Annals of Operations Research, 2006; Optimization Technical Report 02-01, University of Wisconsin-Madison, 2002), Table 4: the estimates of the lower and upper bounds, with their 95% confidence intervals, from Latin hypercube samples of 5000 scenarios"

[reference.cirrelt]
cite = "Zehtabian and Bastin, Penalty parameter update strategies in progressive hedging algorithm (CIRRELT-2016-12), Table 2"

