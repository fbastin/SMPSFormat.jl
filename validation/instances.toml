# The instances of the validation and their published optimal values.
#
# An archive is downloaded at a fixed commit and checked by the git tree hash of its content
# (`Tar.tree_hash`), which does not depend on how GitHub compresses it; a collection published
# as zip files (`zips`, in the directory `url`) is checked by their SHA-256, each extracted in a
# directory named after it. A family gives the files
# of its instances, `{n}` replaced by each instance's `n`; an instance gives its published optimal
# value, `value`, as printed by its reference, or, for an integer program whose optimum is not
# known, the published bounds `lower` and `upper`. The tolerance is half a unit of the last digit
# printed (of the sixth significant digit for a reference that rounds to six, `significant`, of
# the second decimal for one whose solvers agree to two decimals, `decimals`), plus 1e-9 of the
# value for the accuracy of the solve. The reference is the
# collection's own value when there is one; when it differs from ours and another published value,
# computed on the same files, agrees with ours, that one is the reference, and `note` gives the
# collection's. `probability_sums` is the option of `read_smps`: probabilities written with a few
# digits are kept as written where the published values were computed so. `size` sorts the
# instances by the time HiGHS takes on their deterministic equivalent: `small` (seconds, run by
# the continuous integration), `medium` (minutes), `large` (more, and a few gigabytes), `huge`
# (over ten million nonzeros: more memory than most computers have). `known`
# documents a difference that remains, and what is known of its cause: the instance is then
# expected to differ. An instance with neither `value` nor bounds is read only: no optimal value
# is published for it, or its deterministic equivalent has too many scenarios to be built (up
# to 10^204); it must be read without error, in a few seconds (`small`), and its number of
# scenarios is that of its law.

